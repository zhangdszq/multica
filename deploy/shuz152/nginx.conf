pid /opt/multica-shuz152/nginx.pid;
user www-data;
events { worker_connections 256; }
http {
  access_log /opt/multica-shuz152/gateway-access.log;
  error_log /opt/multica-shuz152/gateway-error.log warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 3100;
    server_name _;
    auth_basic "Multica SHUZ-152 test";
    auth_basic_user_file /opt/multica-shuz152/private/test.htpasswd;
    client_max_body_size 100m;
    location ~ ^/(api|auth|ws|v1|uploads|health)(/|$) {
      proxy_pass http://__BACKEND_IP__:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization "";
      proxy_read_timeout 300s;
      proxy_buffering off;
    }
    location / {
      proxy_pass http://__FRONTEND_IP__:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization "";
    }
  }
}
